<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haroon AI Studio Lite</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#eef2f7;font-family:Arial,sans-serif;height:100vh;overflow:hidden}.app{display:flex;height:100vh}.side{width:285px;background:#10131a;border-left:1px solid #252b36;padding:14px;display:flex;flex-direction:column;gap:12px}.brand{font-size:22px;font-weight:800;padding:8px}.new{background:#1b222d;border:1px solid #333c4b;color:#fff;border-radius:12px;padding:12px;cursor:pointer}.chats{flex:1;overflow:auto}.chat{padding:11px;border-radius:10px;color:#cbd3df;cursor:pointer}.chat:hover,.chat.active{background:#202733}.main{flex:1;display:flex;flex-direction:column}.top{height:62px;border-bottom:1px solid #252b36;display:flex;align-items:center;gap:10px;padding:0 16px}.status{margin-right:auto;color:#75d6a4;font-size:12px}.toggle{display:none}.messages{flex:1;overflow:auto;padding:25px;display:flex;flex-direction:column;gap:14px}.msg{max-width:850px;padding:13px 16px;border-radius:16px;white-space:pre-wrap;line-height:1.7}.user{align-self:flex-start;background:#242c39}.assistant{align-self:flex-end;background:#141a22;border:1px solid #27303d}.ops{font-size:12px;color:#93a0b2;margin-top:8px}.composer{padding:14px;border-top:1px solid #252b36}.box{max-width:900px;margin:auto;display:flex;gap:8px;background:#141820;border:1px solid #303846;border-radius:16px;padding:8px}.box input{flex:1;background:none;border:0;outline:0;color:#fff;padding:10px}.send{border:0;border-radius:11px;padding:0 18px;cursor:pointer}.empty{margin:auto;text-align:center;color:#8994a5}.empty b{display:block;font-size:31px;color:#fff;margin-bottom:8px}@media(max-width:700px){.side{position:fixed;z-index:5;right:-300px;height:100%;transition:.2s}.side.open{right:0}.toggle{display:block;background:#1b222d;border:1px solid #333c4b;color:white;border-radius:9px;padding:7px}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand">✦ Haroon AI</div><button class="new" onclick="newChat()">＋ محادثة جديدة</button><div class="chats" id="chats"></div><small style="color:#687384">Studio Lite • V1</small></aside><main class="main"><header class="top"><button class="toggle" onclick="toggleSide()">☰</button><b>Haroon AI Studio Lite</b><span class="status" id="status">Bridge...</span></header><section class="messages" id="messages"></section><footer class="composer"><form class="box" onsubmit="send(event)"><input id="input" placeholder="مثال: اصنع منصة 30 في 30 في منتصف الماب"><button class="send">إرسال</button></form></footer></main></div>
<script>
let chats=JSON.parse(localStorage.haroonChats||"{}"),current=localStorage.haroonCurrent||"";
const $=x=>document.getElementById(x);
function save(){localStorage.haroonChats=JSON.stringify(chats);localStorage.haroonCurrent=current}
function newChat(){current=crypto.randomUUID();chats[current]={title:"محادثة جديدة",messages:[]};save();render()}
function ensure(){if(!current||!chats[current])newChat()}
function render(){ensure();$("chats").innerHTML="";Object.entries(chats).reverse().forEach(([id,c])=>{let d=document.createElement("div");d.className="chat "+(id==current?"active":"");d.textContent=c.title;d.onclick=()=>{current=id;save();render()};$("chats").appendChild(d)});let m=$("messages");m.innerHTML="";if(!chats[current].messages.length){m.innerHTML='<div class="empty"><b>Haroon AI</b>اكتب ما تريد أن أبنيه في الماب.</div>';return}chats[current].messages.forEach(x=>{let d=document.createElement("div");d.className="msg "+x.role;d.textContent=x.text;if(x.ops?.length){let o=document.createElement("div");o.className="ops";o.textContent="⚙ تم إرسال "+x.ops.length+" عملية إلى Bridge";d.appendChild(o)}m.appendChild(d)});m.scrollTop=m.scrollHeight}
async function health(){try{let r=await fetch("/health");let d=await r.json();$("status").textContent=d.ok&&d.bridgeConfigured?"● Bridge جاهز":"● ضع Bridge password في Render"}catch{$("status").textContent="● غير متصل"}}
async function send(e){e.preventDefault();ensure();let i=$("input"),text=i.value.trim();if(!text)return;chats[current].messages.push({role:"user",text});if(chats[current].messages.length===1)chats[current].title=text.slice(0,28);i.value="";chats[current].messages.push({role:"assistant",text:"جارٍ فهم الطلب وتنفيذه…"});save();render();try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chatId:current,text})}),d=await r.json();if(!r.ok)throw Error(d.error);chats[current].messages.pop();chats[current].messages.push({role:"assistant",text:d.reply,ops:d.operations});save();render()}catch(e){chats[current].messages.pop();chats[current].messages.push({role:"assistant",text:"حدث خطأ: "+e.message});save();render()}}
function toggleSide(){$("side").classList.toggle("open")}ensure();render();health();setInterval(health,5000);
</script></body></html>
